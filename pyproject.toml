[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artificial-curiosity"
version = "0.4.0"
description = "A curiosity layer for AI: generate and rank valuable unanswered questions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Artificial Curiosity" }]
keywords = [
  "curiosity",
  "research",
  "mcp",
  "openai-tools",
  "scientific-discovery",
  "openalex",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/KanakMalpani/Artificial-Emotions"
Repository = "https://github.com/KanakMalpani/Artificial-Emotions"
Issues = "https://github.com/KanakMalpani/Artificial-Emotions/issues"
Documentation = "https://github.com/KanakMalpani/Artificial-Emotions#readme"
Changelog = "https://github.com/KanakMalpani/Artificial-Emotions/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  # Pinned to one minor: `ruff format --check` is version-sensitive, so a wider
  # range silently reformats the tree under CI and turns main red.
  "ruff>=0.15,<0.16",
]
embeddings = [
  "sentence-transformers>=3.0,<5",
]

[project.scripts]
curiosity = "artificial_curiosity.cli:main"
curiosity-mcp = "artificial_curiosity.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artificial_curiosity"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

# Worksheet templates and eval fixtures are read at runtime (bayesian, voi,
# compare, elicit_eval, evals, `curiosity evals …`). Without this they only
# exist in a source checkout and pip-installed users hit FileNotFoundError.
# Resolution lives in artificial_curiosity/resources.py.
[tool.hatch.build.targets.wheel.force-include]
"examples/bayesian_surprise_worksheet.json" = "artificial_curiosity/data/examples/bayesian_surprise_worksheet.json"
"examples/constitution_veto_stack.json" = "artificial_curiosity/data/examples/constitution_veto_stack.json"
"examples/elicit_ab_protocol.json" = "artificial_curiosity/data/examples/elicit_ab_protocol.json"
"examples/elicit_ab_sample_responses.json" = "artificial_curiosity/data/examples/elicit_ab_sample_responses.json"
"examples/voi_worksheet_template.json" = "artificial_curiosity/data/examples/voi_worksheet_template.json"
"evals/fixtures" = "artificial_curiosity/data/evals/fixtures"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/evals",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/CONTRIBUTING.md",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "e2e: end-to-end surface tests (API TestClient + CLI main)",
  "slow: optional network/literature tests (may skip offline)",
]

[tool.coverage.run]
source = ["src/artificial_curiosity"]
branch = false

[tool.coverage.report]
# Ratchet floor, not a target — raise it as coverage grows, never lower it.
# Sits a couple of points under the measured total so ordinary churn does not
# turn CI red; drops below it mean real coverage was removed.
fail_under = 85
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",   # long docstrings / URLs OK
  "B008",   # FastAPI Depends / Query in defaults
  "B905",   # zip(strict=) — gradual; equal-length lists already guarded
  "UP042",  # Domain/GapStatus stay str,Enum for pydantic/JSON compat
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
