name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; skip PyPI upload"
        type: boolean
        default: true
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/publish.yml"
      - "README.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  # Never upload something the suite has not passed on.
  test:
    name: Lint + pytest before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests examples

      - name: Ruff format (check)
        run: ruff format --check src tests examples

      - name: Pytest + coverage gate
        run: pytest -q --cov --cov-report=term-missing

  build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      # The artifact about to be uploaded is the one we verify — not the repo.
      - name: Verify the wheel works outside a checkout
        run: |
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install --upgrade pip
          /tmp/relcheck/bin/pip install dist/*.whl
          cd /tmp
          /tmp/relcheck/bin/python - <<'PY'
          from artificial_emotions.bayesian import fill_surprise_worksheet
          from artificial_emotions.compare import load_constitution_stack
          from artificial_emotions.elicit_eval import load_elicit_protocol
          from artificial_emotions.evals import load_fixtures
          from artificial_emotions.voi import fill_voi_worksheet

          assert fill_surprise_worksheet(question_id="q")["fields"]
          assert fill_voi_worksheet(question_id="q")
          assert load_constitution_stack()
          assert load_elicit_protocol()["conditions"]
          assert load_fixtures()
          PY
          /tmp/relcheck/bin/curiosity spark --domain ai --n 3 --json > /dev/null
          /tmp/relcheck/bin/curiosity-mcp --list-tools > /dev/null

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    # For Trusted Publishing later: add `id-token: write` and drop `password:` below.
    permissions:
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
